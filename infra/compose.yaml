name: asi-meal-management

services:
  web:
    build:
      context: ../apps/web
      dockerfile: ../../infra/web.Dockerfile
    environment:
      ASI_API_ORIGIN: http://api:8000
    networks:
      app:
        ipv4_address: 172.30.240.4

  api:
    build:
      context: ../apps/api
      dockerfile: ../../infra/api.Dockerfile
    environment:
      ASI_AUTH_ENABLED: "true"
      ASI_AUTH_MODE: https
      ASI_AUTH_ORIGINS: "https://${LAN_HOST:?Set LAN_HOST in infra/.env}:43873"
      ASI_DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:?Set POSTGRES_USER in infra/.env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/.env}@db:5432/${POSTGRES_DB:?Set POSTGRES_DB in infra/.env}"
    networks:
      app:
        ipv4_address: 172.30.240.3

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in infra/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/.env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in infra/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      app:
        ipv4_address: 172.30.240.5

  gateway:
    image: caddy:2-alpine
    ports:
      - "43873:443"
    environment:
      LAN_HOST: ${LAN_HOST:?Set LAN_HOST in infra/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      app:
        ipv4_address: 172.30.240.2

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  app:
    name: asi-meal-management-private
    ipam:
      config:
        - subnet: 172.30.240.0/24
